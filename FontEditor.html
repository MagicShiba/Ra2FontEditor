<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RA2 位图字体编辑器</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>

<h1>RA2 位图字体编辑器
  <label class="sc-tc-toggle top-toggle" title="将简体中文转为繁体，用于输简体显示繁体。" style="margin-left:16px;">
    <input type="checkbox" id="sc-tc-toggle">简繁转换
  </label>
</h1>

<div class="app-layout" id="app-layout">

  <!-- ===== LEFT PANEL ===== -->
  <div class="panel left-panel">
    <div id="info-section">
      <h2 class="section-toggle" data-target="info-content">字体信息 <span class="toggle-icon">▼</span></h2>
      <div id="info-content">
    <div id="dropzone">
      拖放 .FNT 文件到此处<br>
      <span style="font-size:11px;color:#6c7086;">或点击选择文件</span>
      <input type="file" id="file-input" accept=".fnt,.FNT" style="display:none">
    </div>
        <div class="info-grid" id="info-grid"></div>
        <div class="field-row" style="margin-top:4px">
          <label title="Ideograph Width（来自字体文件头）">宽度 <input type="number" id="font-width-input" min="1" max="255"></label>
          <label>高度 <input type="number" id="font-height-input" min="1" max="255"></label>
          <button id="apply-font-size" title="默认应该不需要改这个，我不知道会有什么后果。">应用</button>
        </div>
        <button id="save-btn" style="margin-top:4px" class="primary">保存字体</button>
      </div>
    </div>

    <h2>字符列表</h2>
    <div class="search-row">
      <select id="nav-dropdown" style="display:none">
        <option value="">— 快速定位 —</option>
      </select>
      <input type="text" id="search-input" placeholder="搜索字符/U+编码...">
    </div>
    <div id="batch-info-bar" style="display:none;font-size:11px;color:#a6e3a1;flex-shrink:0;padding:2px 4px;background:#11111b;border-radius:3px;">
      已选 <span id="batch-count">0</span> 个字符
    </div>

    <div id="char-group-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;min-height:0"></div>
  </div>

  <!-- ===== CENTER PANEL ===== -->
  <div class="panel center-panel" id="center-panel">
    <div class="editor-header-row">
      <h2>编辑器</h2>
      <div class="toolbar">
        <label>缩放 <input type="range" id="editor-zoom" min="2" max="32" step="1" value="10"></label>
        <button id="copy-to-clipboard" title="复制原始分辨率图像到剪切板">复制图像</button>
        <button id="clear-editor" title="清空画布">清空画布</button>
        <button id="refresh-char-list" title="刷新字符列表">刷新列表</button>
      </div>
    </div>
    <div id="editor-container">
      <canvas id="editor-canvas"></canvas>
    </div>

    <div id="preview-section">
      <div id="preview-resize-handle"></div>
      <div class="preview-header-row">
        <h2>预览</h2>
        <label>缩放倍数 <input type="range" id="preview-scale" min="1" max="6" step="1" value="2"></label>
        <label>前景色 <input type="color" id="fg-color" value="#FFAA00">
          <select id="fg-preset" title="预设颜色">
            <option value="">预设</option>
            <option value="#FFFF00">黄色</option>
            <option value="#FF8800">橙色</option>
            <option value="#FF0000">红色</option>
            <option value="#00FFFF">青色</option>
            <option value="#00FF00">绿色</option>
            <option value="#89b4fa">蓝色</option>
            <option value="#4400ff">紫色</option>
            <option value="#f5c2e7">品红</option>
            <option value="#eba0ac">粉红</option>
            <option value="#FFFFFF">白色</option>
          </select>
        </label>
        <label>背景色 <input type="color" id="bg-color" value="#1e1e2e"></label>
        <button id="preview-popup-btn" title="放大高分辨率查看">查看</button>
      </div>
      <div class="preview-area">
        <div class="preview-body">
          <textarea id="text-input" rows="2">Hello World! RA2 Font Edit！
红警2字体编辑器，预览文本。
一键转换你喜欢的字体！
The quick brown fox jumps over a lazy dog.</textarea>
          <div class="preview-canvas-wrap">
            <canvas id="preview-canvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== RIGHT PANEL ===== -->
  <div class="panel right-panel" id="right-panel">
    <h2>符号参数</h2>
    <div id="glyph-info">请选择一个字符</div>
    <div id="glyph-char-preview" style="display:none;text-align:center;padding:8px;background:#11111b;border-radius:4px;border:1px solid #313244;flex-shrink:0">
      <div id="glyph-char-display" style="font-size:48px;line-height:1;color:#cdd6f4;font-family:monospace"></div>
      <div style="font-size:11px;color:#6c7086;margin-top:4px">实际文字 (Unicode)</div>
    </div>

    <div class="section">
      <h3>调整宽度</h3>
      <div class="field-row">
        <input type="number" id="glyph-width-input" min="1" max="255" style="width:70px">
        <button id="apply-width" class="primary">应用</button>
      </div>
    </div>

    <div class="section">
      <h3>移动位置</h3>
      <div class="move-grid">
        <div></div><button id="move-up">↑</button><div></div>
        <button id="move-left">←</button><button id="move-center">↻</button><button id="move-right">→</button>
        <div></div><button id="move-down">↓</button><div></div>
      </div>
    </div>

    <div class="section">
      <h3>批量操作</h3>
      <div id="batch-info" style="font-size:11px;color:#6c7086;">在左侧勾选范围进行批量操作</div>
      <div class="field-row" style="margin-top:4px">
        <label>宽度 <input type="number" id="batch-width-input" min="1" max="255" style="width:60px"></label>
        <button id="batch-set-width">设置</button>
      </div>
      <div class="field-row" style="margin-top:4px">
        <button id="batch-center">居中</button>
        <button id="batch-clear-all">清除全部</button>
      </div>
    </div>

    <div class="section">
      <h2>系统字体转为RA2字体</h2>
    <div class="right-drop-hint" id="right-drop-hint">拖放字体文件到此处<br><span style="font-size:10px;color:#6c7086;">.fnt / 系统字体文件</span></div>
      <div class="field-row font-picker-row">
        <div id="font-picker" class="font-picker">
          <input type="text" id="sys-font-family" placeholder="选择字体..." readonly>
          <span class="picker-arrow">▼</span>
          <div id="font-picker-list" class="font-picker-list"></div>
        </div>
      </div>
      <div id="conv-preview-section" style="display:none">
        <div class="conv-preview-row">
          <div class="conv-preview-item">
            <span style="font-size:10px;color:#6c7086">原始</span>
            <canvas id="conv-preview-before"></canvas>
          </div>
          <div class="conv-preview-item">
            <span style="font-size:10px;color:#6c7086">系统字体</span>
            <canvas id="conv-preview-sysfont"></canvas>
          </div>
          <div class="conv-preview-item">
            <span style="font-size:10px;color:#6c7086">转换</span>
            <canvas id="conv-preview-after"></canvas>
          </div>
        </div>
        <label style="font-size:11px;color:#a6adc8;display:flex;align-items:center;gap:4px;margin-top:2px">阈值<input type="range" id="conv-threshold" min="0" max="255" value="128" style="width:75%">
          <span id="conv-threshold-val" style="font-size:10px;color:#6c7086;min-width:20px">128</span>
        </label>
        <div class="field-row" style="margin-top:2px">
          <label class="sc-tc-toggle" title="仅保留右下+右侧1px阴影,剔除原文字,营造3D镂空效果">
            <input type="checkbox" id="shadow-toggle">3D阴影
          </label>
        </div>
      </div>
      <div class="field-row" style="margin-top:4px">
        <button id="sys-font-convert">转换选中</button>
        <button id="sys-font-convert-all">转换全部</button>
      </div>
      <div style="font-size:10px;color:#585b70;margin-top:2px">最大 15×17 分辨率</div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="src/STConversion.js"></script>
<script src="src/app.js"></script>
</body>
</html>
